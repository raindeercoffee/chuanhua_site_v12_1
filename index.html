<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>川花 RIVER FLOWER｜正式網站已搬家</title>
<link rel="canonical" href="https://riverflower2025.com/">
<meta name="robots" content="noindex, follow">
<meta http-equiv="refresh" content="3; url=https://riverflower2025.com/">
<style>
  :root { --bg: #f6f1e7; --ink: #2f3a33; --soft: #7a8277; --accent: #8a6d3b; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Serif TC", "PingFang TC", "Microsoft JhengHei", serif;
    display: flex; align-items: center; justify-content: center;
    padding: 24px 16px; text-align: center;
  }
  main { max-width: 420px; }
  .mark { font-size: 13px; letter-spacing: .35em; color: var(--soft); margin-bottom: 20px; }
  h1 { font-size: 24px; font-weight: 600; line-height: 1.6; margin: 0 0 12px; }
  p { font-size: 16px; line-height: 1.8; color: var(--soft); margin: 0 0 28px; }
  a.btn {
    display: inline-block; padding: 14px 28px; border-radius: 999px;
    background: var(--ink); color: var(--bg); text-decoration: none;
    font-size: 16px; letter-spacing: .05em;
  }
  a.btn:hover { background: var(--accent); }
  .count { margin-top: 18px; font-size: 13px; color: var(--soft); }
</style>
</head>
<body>
<main>
  <div class="mark">川花 · RIVER FLOWER</div>
  <h1>川花正式網站在<br>riverflower2025.com</h1>
  <p>這裡是舊版網站，<br>正在帶你前往正式網站。</p>
  <a class="btn" href="https://riverflower2025.com/">前往川花正式網站</a>
  <div class="count"><span id="s">3</span> 秒後自動前往</div>
</main>
<script>
  var n = 3, el = document.getElementById('s');
  var t = setInterval(function () {
    n -= 1;
    if (n <= 0) { clearInterval(t); location.replace('https://riverflower2025.com/'); return; }
    el.textContent = n;
  }, 1000);
</script>
</body>
</html>
